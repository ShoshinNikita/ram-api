[project]
name = "ram-api"
version = "0.1.0"
description = "Dockerized FastAPI wrapper around the recognize-anything image recognition models"
requires-python = ">=3.15"
dependencies = [
    "fairscale==0.4.13",
    "fastapi==0.162.0",
    "pillow==13.0.0",
    "pycocoevalcap==1.2",
    "pydantic-settings==2.16.2",
    "python-magic==0.4.27",
    "python-multipart==0.0.32",
    "ram",
    "rawpy==0.27.1",
    "scipy==1.18.1",
    "timm==1.0.30",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.55.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ram = { git = "https://github.com/xinyu1205/recognize-anything.git", rev = "7cb804a8609e9f4b1a50b7f31436d2df40bb9481" }

[tool.uv]
override-dependencies = [
    { package = { name = "ram" }, dependencies = [ "transformers==4.55.4", "timm==1.0.30", "fairscale==0.4.13" ] },
]
